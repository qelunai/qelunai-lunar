name: qelunai_lunar
description: >-
  Vietnamese lunisolar calendar (âm lịch) in pure Dart: solar/lunar conversion
  with leap months (UTC+7), Can Chi, 24 solar terms (tiết khí), lucky days
  and hours (hoàng đạo), thập nhị trực.
version: 0.1.0
homepage: https://qelunai.com
repository: https://github.com/qelunai/qelunai-lunar
issue_tracker: https://github.com/qelunai/qelunai-lunar/issues
topics:
  - calendar
  - lunar
  - vietnamese

environment:
  sdk: ^3.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
